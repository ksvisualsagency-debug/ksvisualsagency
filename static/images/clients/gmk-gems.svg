  <text x="300" y="400" fill="#00cc76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" text-anchor="middle">JEWELRY & LUXURY</text>

