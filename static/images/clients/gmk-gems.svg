      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cc76" />
      <stop offset="100%" stop-color="#ee2b6c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00cc76" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00cc76" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgGrad)" stroke="#26262b" stroke-width="3" />
